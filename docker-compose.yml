services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    networks:
      - ai-network
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    networks:
      - ai-network
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - ollama
    restart: unless-stopped

networks:
  ai-network:
    name: ai-network

volumes:
  ollama:
  open-webui:
